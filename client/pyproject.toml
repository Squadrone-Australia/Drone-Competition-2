[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "squadrone-client"
version = "0.1.0"
description = "Contestant Python API for the Squadrone drone racing simulator"
requires-python = ">=3.11"
dependencies = [
    "websockets>=15",
    "numpy>=2.0",
    "Pillow>=10",
]

[tool.setuptools.packages.find]
include = ["squadrone*"]
