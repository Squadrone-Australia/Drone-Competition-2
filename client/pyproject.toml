[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name (what `pip install` takes) differs from the import name:
# `pip install squadrone-comp2`, then `from squadrone import Drone`.
name = "squadrone-comp2"
version = "0.1.0"
description = "Contestant Python API for the Squadrone drone racing simulator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Squadrone Australia" }]
requires-python = ">=3.11"
dependencies = [
    "websockets>=15",
    "numpy>=2.0",
    "Pillow>=10",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Squadrone-Australia/Drone-Competition-2"
Documentation = "https://github.com/Squadrone-Australia/Drone-Competition-2/blob/main/docs/squadrone-guide.md"

[tool.setuptools.packages.find]
include = ["squadrone*"]
