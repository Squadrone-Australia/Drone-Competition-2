name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with the ruff pin in pyproject.toml's dev extra.
  RUFF_VERSION: 0.16.7

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Ruff needs no project dependencies — skip the editable install entirely.
      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Check formatting
        run: ruff format --check --diff .

      # Runs even when the formatter step failed, so one run reports both.
      - name: Lint
        if: ${{ !cancelled() }}
        run: ruff check --output-format=github .

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]

    steps:
      # The vendored frontend bundles are committed, so a shallow checkout is
      # enough for tests/test_offline_assets.py.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Load-bearing: tests/test_js.py shells out to `node --test`
      # and silently skips when node is missing, so without this the JS contract
      # tests would vanish from CI behind a green check.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # comp2/sim/scene.py and render.py import cv2 at module import time, and
      # opencv-python links libGL/libglib. Note the t64 suffix on ubuntu-24.04.
      - name: Install OpenCV system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0t64

      # Not requirements.txt — that is a Windows pip-freeze snapshot.
      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Python tests
        run: python -m pytest -rs

      # Also driven by pytest via subprocess; run directly for a clear signal.
      # Bash (Git Bash on the Windows runner) expands the glob, so node gets real
      # file paths — `node --test <dir>` is not supported on node 22.
      - name: JS tests
        shell: bash
        run: node --test tests/js/*.test.js

  # The one-step setup scripts contestants are told to run (README Quick start).
  # Run from the checkout, they install into it rather than cloning, so this
  # tests the branch's own code; git pull on the detached HEAD only warns.
  install-script:
    name: install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      COMP2_NO_LAUNCH: "1"

    steps:
      - uses: actions/checkout@v5

      # Same libraries as the test job; install.sh stops and names them if missing.
      - name: Install OpenCV system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0t64

      - name: Run install.sh
        if: runner.os != 'Windows'
        run: sh scripts/install.sh

      # Windows PowerShell 5.1, which is what contestants have.
      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/install.ps1

      - name: Simulator starts and serves the page
        shell: bash
        run: |
          py=venv/bin/python
          [ -x "$py" ] || py=venv/Scripts/python.exe
          "$py" -m comp2 --no-browser &
          trap 'kill $! 2>/dev/null' EXIT
          for _ in $(seq 60); do
            curl -sf -o /dev/null http://127.0.0.1:8765/ && exit 0
            sleep 1
          done
          echo "simulator did not answer on port 8765" >&2
          exit 1
